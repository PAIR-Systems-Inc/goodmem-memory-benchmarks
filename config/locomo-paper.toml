# LoCoMo with the paper's own retrieval models, for a comparable score.
#
# The paper reports two LoCoMo settings and they land within 0.06 points of each
# other for the GPT-4o-mini reader:
#
#   Table 10  text-embedding-3-small + Cohere Rerank-v3.5   89.07 / 93.70
#   Table 11  Qwen3-Embedding-4B     + Qwen3-Reranker-4B    89.13 / 94.55
#                                       (gpt-4o-mini / gpt-4.1-mini)
#
# This configuration pairs the embedder from the first with the reranker from
# the second, because those are the two paper-native components available on
# this instance: there is no Cohere credential here, and Qwen3-Embedding-4B is
# not served. So it is not an exact reproduction of either row, and the README
# says so. Both components are models the paper itself used, and the two rows
# bracket tightly enough to give an unambiguous target.

[run]
run_tag = "paper-models"
ingest_tag = "paper-models"
dataset_path = "data/locomo10.json"
results_dir = "results"
conversations = []
categories = [1, 2, 3, 4]
reader_concurrency = 50

[server]
base_url = "https://localhost:8080"
tls_verify = false
timeout_seconds = 300.0
requests_per_second = 5.0
llm_requests_per_second = 15.0

[models]
# Supplied from the environment; see .env.example. For this configuration:
#   GMBENCH_EMBEDDER_ID -> OpenAI text-embedding-3-small (1536d)
#   GMBENCH_RERANKER_ID -> Qwen/Qwen3-Reranker-4B served over vLLM
embedder_id = ""
reranker_id = ""
reader_model = "gpt-4o-mini"
judge_model = "gpt-4o-mini-2024-07-18"
reader_max_tokens = 4096
judge_repetitions = 3
judge_llm_id = ""

[models.reader_llm_ids]

[chunking]
chunk_size = 1500
chunk_overlap = 150
separators = ["\n\n", "\n", ". ", " ", ""]

[retrieval]
# The paper's two-stage depths, unchanged: 128 dense candidates, 15 reranked.
# Holding these at the published values is the point of this configuration, so
# the sweep-selected k=30 is deliberately not used here.
dense_candidates = 128
final_k = 15
neighbor_turns = 2
ef_search = 400
iterative_scan = "ITERATIVE_SCAN_RELAXED_ORDER"
concurrency = 8

[ingest]
batch_size = 64
space_concurrency = 2
ready_poll_seconds = 3.0
ready_timeout_seconds = 3600.0
# OpenAI's embedding limits are far above Voyage's 2,000 RPM, so ingest can run
# closer to the server's own ceiling here.
embed_requests_per_minute = 3000
repair_rounds = 4
