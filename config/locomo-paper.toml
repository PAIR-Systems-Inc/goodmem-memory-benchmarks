# LoCoMo with the paper's retrieval depths: 128 candidates, 15 selections.
# The hosted Qwen run uses text-embedding-3-small with DashScope qwen3-rerank.
# This differs from table 10's Cohere reranker and table 11's Qwen embedder.
# See docs/running.md for other rerankers and the local Qwen checkpoint.

[run]
run_tag = "paper-qwen3"
ingest_tag = "paper-models"
dataset_path = "data/locomo10.json"
results_dir = "results"
conversations = []
categories = [1, 2, 3, 4]
reader_concurrency = 50

[server]
base_url = "https://localhost:8080"
tls_verify = false
timeout_seconds = 300.0
requests_per_second = 5.0
llm_requests_per_second = 15.0

[models]
# Set GMBENCH_EMBEDDER_ID to the text-embedding-3-small registration (1536d)
# and GMBENCH_RERANKER_ID to the hosted qwen3-rerank registration.
# Qwen rerankers need their yes/no relevance template. Check an endpoint with
# verify-reranker before using it for a scored run.
embedder_id = ""
reranker_id = ""
reader_model = "gpt-4o-mini"
judge_model = "gpt-4o-mini-2024-07-18"
reader_max_tokens = 4096
judge_repetitions = 3
judge_llm_id = ""

[models.reader_llm_ids]

[chunking]
# Character-based chunks; the paper's token windows are a different boundary.
chunk_size = 1500
chunk_overlap = 150
separators = ["\n\n", "\n", ". ", " ", ""]

[retrieval]
dense_candidates = 128
final_k = 15
neighbor_turns = 2
ef_search = 400
iterative_scan = "ITERATIVE_SCAN_RELAXED_ORDER"
concurrency = 8

[ingest]
batch_size = 64
space_concurrency = 2
ready_poll_seconds = 3.0
ready_timeout_seconds = 3600.0
# Adjust the submission rate to your embedding provider's allowance.
embed_requests_per_minute = 3000
repair_rounds = 4
