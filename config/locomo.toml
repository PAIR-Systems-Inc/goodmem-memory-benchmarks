# LoCoMo with a top-30 context, as used by the Voyage runs.
# Model registrations come from the environment; see .env.example.

[run]
run_tag = "voyage4l-rerank25"
dataset_path = "data/locomo10.json"
results_dir = "results"
# An empty list selects all ten conversations. Category 5 is excluded.
conversations = []
categories = [1, 2, 3, 4]
reader_concurrency = 50

[server]
base_url = "https://localhost:8080"
tls_verify = false
timeout_seconds = 300.0
# Stay below the development instance's observed limit of about six requests/s.
# Throttling delays further requests through the shared limiter.
requests_per_second = 5.0
# Proxied model calls have a separate allowance because they run upstream.
llm_requests_per_second = 15.0

[models]
# The published Voyage runs use voyage-4-large (1024 dimensions) with
# rerank-2.5 or rerank-3. Set their registration UUIDs in the environment.
embedder_id = ""
reranker_id = ""
# Keep reader and judge settings fixed when comparing retrieval configurations.
reader_model = "gpt-4o-mini"
judge_model = "gpt-4o-mini-2024-07-18"
reader_max_tokens = 4096
judge_repetitions = 3
judge_llm_id = ""

# GMBENCH_READER_LLM_IDS accepts "gpt-4o-mini=<uuid>,gpt-4.1-mini=<uuid>".
[models.reader_llm_ids]

[chunking]
# Character counts. Most turns fit in one chunk; longer turns may be split.
chunk_size = 1500
chunk_overlap = 150
separators = ["\n\n", "\n", ". ", " ", ""]

[retrieval]
# Rerank the dense candidates, then expand each selected turn by two neighbors
# on either side. This setup supplies roughly 4,800 evidence tokens per question.
dense_candidates = 128
final_k = 30
neighbor_turns = 2
ef_search = 400
iterative_scan = "ITERATIVE_SCAN_RELAXED_ORDER"
concurrency = 8

[ingest]
batch_size = 64
space_concurrency = 2
ready_poll_seconds = 3.0
ready_timeout_seconds = 3600.0
# Pace memory submissions for the embedding provider. Failed embeddings are
# retried in repair passes; completed memories are kept.
embed_requests_per_minute = 1500
repair_rounds = 4
