[project]
name = "gmbench"
version = "0.1.0"
description = "Reproduce RAW-RAG memory experiments with GoodMem as the context layer"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "python-dateutil>=2.9",
    "rich>=13.7",
    "tqdm>=4.66",
    "tomli-w>=1.0",
]

[project.scripts]
gmbench = "gmbench.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmbench"]

[tool.ruff]
line-length = 100
target-version = "py313"
